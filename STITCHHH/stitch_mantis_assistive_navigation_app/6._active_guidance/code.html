afe { padding-top: env(safe-area-inset-top, 24px); } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-background text-on-surface font-body-md text-body-md min-h-screen w-screen relative overflow-hidden antialiased select-none">
<!-- Full-screen camera feed background -->
<div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida/AEtjO1V3RBwH1A_ItSUPzMiRRitIUXHiQwbevrje5X-nN8Ff3kha0I5jEIKJ8PjfJt8sUU1O2PCO24WQwJ90V9Lut3jdF-oEOeU9wwZdi011ulyLJDG-dfKNaVwGIYL34CeLUzA59m9fcRdr1BsrehQVYJwtVJ7tSCuvIt850R4CkWSpr5n6yuatYLSuHvhuLXuC-q6jSnRawVXkn-5bJJ3qlQtGqbp4tlPI4774mWG-1y1ZczLjE3Mnv5y231Q');">
<div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/80 pointer-events-none"></div>
</div>
<main class="relative z-10 w-full h-full min-h-screen flex flex-col justify-between items-center px-margin-mobile pt-safe pb-safe">
<!-- Top Area: State Indicator & Spoken Sentence -->
<div class="w-full flex flex-col items-center pt-8 sm:pt-12 gap-5 max-w-sm">
<!-- ONE prominent state indicator -->
<div class="inline-flex items-center gap-2.5 px-6 py-2.5 rounded-full bg-primary-container text-on-primary-container shadow-2xl transition-transform">
<span class="w-2.5 h-2.5 rounded-full bg-on-primary-container animate-ping"></span>
<span class="font-label-md text-label-md tracking-wider font-bold uppercase">YOU’RE LINED UP</span>
</div>
<!-- ONE supporting spoken-equivalent sentence -->
<div class="w-full px-6 py-4 rounded-2xl bg-surface-container-lowest/80 backdrop-blur-xl border border-white/5 shadow-2xl text-center">
<p class="font-headline-sm text-headline-sm sm:text-headline-md text-on-surface font-semibold tracking-normal leading-snug">
          “Your backpack is ahead. Walk slowly forward.”
        </p>
</div>
</div>
<!-- Quiet Center: Audio & Haptics active, visual UI out of the way -->
<div class="flex-1"></div>
<!-- Bottom Area: ONE small unobtrusive control -->
<div class="w-full flex flex-col items-center pb-6">
<button aria-label="Pause Guidance" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full bg-surface-container-high/80 backdrop-blur-xl border border-white/10 text-on-surface hover:bg-surface-container-highest active:scale-95 transition-all shadow-lg" id="pauseBtn" type="button">
<span class="material-symbols-outlined text-[20px] text-primary-container" id="pauseIcon">pause_circle</span>
<span class="font-label-md text-label-md font-medium text-on-surface/90" id="pauseText">Pause Guidance</span>
</button>
</div>
</main>
<script>
    (function() {
      const pauseBtn = document.getElementById('pauseBtn');
      const pauseText = document.getElementById('pauseText');
      const pauseIcon = document.getElementById('pauseIcon');
      let isPaused = false;

      if (pauseBtn && pauseText && pauseIcon) {
        pauseBtn.addEventListener('click', function() {
          isPaused = !isPaused;
          pauseText.textContent = isPaused ? 'Resume Guidance' : 'Pause Guidance';
          pauseIcon.textContent = isPaused ? 'play_circle' : 'pause_circle';
          pauseBtn.setAttribute('aria-label', isPaused ? 'Resume Guidance' : 'Pause Guidance');
        });
      }
    })();
  </script>
</body></html>
