<!-- Test Feedback Action Button -->

</button>

<script>
  function selectSpeed(btn, speed) {
    document.querySelectorAll('.speed-btn').forEach(b => {
      b.classList.remove('bg-primary-container', 'text-on-primary', 'font-bold', 'shadow-md');
      b.classList.add('text-on-surface-variant');
      b.setAttribute('aria-checked', 'false');
    });
    btn.classList.add('bg-primary-container', 'text-on-primary', 'font-bold', 'shadow-md');
    btn.classList.remove('text-on-surface-variant');
    btn.setAttribute('aria-checked', 'true');
    const label = document.getElementById('speech-speed-indicator');
    if (label) label.textContent = speed;
  }

  function selectDetail(btn) {
    document.querySelectorAll('.detail-btn').forEach(b => {
      b.classList.remove('bg-primary-container', 'text-on-primary', 'font-bold', 'shadow-md');
      b.classList.add('text-on-surface-variant');
      b.setAttribute('aria-checked', 'false');
    });
    btn.classList.add('bg-primary-container', 'text-on-primary', 'font-bold', 'shadow-md');
    btn.classList.remove('text-on-surface-variant');
    btn.setAttribute('aria-checked', 'true');
  }

  function runFeedbackTest() {
    const btn = document.getElementById('btn-test-feedback');
    const label = document.getElementById('btn-test-text');
    if (!btn || !label) return;

    if (navigator.vibrate) {
      navigator.vibrate([100, 80, 150]);
    }

    const prevText = label.textContent;
    label.textContent = "Signal Tested ✓";
    btn.classList.remove('bg-primary-container', 'text-on-primary');
    btn.classList.add('bg-secondary', 'text-on-secondary');

    setTimeout(() => {
      label.textContent = prevText;
      btn.classList.remove('bg-secondary', 'text-on-secondary');
      btn.classList.add('bg-primary-container', 'text-on-primary');
    }, 1800);
  }

  // Ensure 'More' tab is highlighted in App Shell bottom nav
  (function activateMoreNavTab() {
    const navItems = document.querySelectorAll('nav[aria-label="Primary Wayfinding Navigation"] a');
    navItems.forEach(item => {
      if (item.getAttribute('data-path') === 'more-settings') {
        item.classList.remove('text-on-surface-variant');
        item.classList.add('text-primary-container', 'font-label-md', 'font-bold');
      } else {
        item.classList.remove('text-primary-container', 'font-label-md', 'font-bold');
        item.classList.add('text-on-surface-variant');
      }
    });
  })();
