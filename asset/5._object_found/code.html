<div class="fixed inset-0 w-full h-full z-0 overflow-hidden">
<img alt="Camera viewfinder active stream" class="w-full h-full object-cover object-center pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1V3RBwH1A_ItSUPzMiRRitIUXHiQwbevrje5X-nN8Ff3kha0I5jEIKJ8PjfJt8sUU1O2PCO24WQwJ90V9Lut3jdF-oEOeU9wwZdi011ulyLJDG-dfKNaVwGIYL34CeLUzA59m9fcRdr1BsrehQVYJwtVJ7tSCuvIt850R4CkWSpr5n6yuatYLSuHvhuLXuC-q6jSnRawVXkn-5bJJ3qlQtGqbp4tlPI4774mWG-1y1ZczLjE3Mnv5y231Q"/>
<!-- Subtle Vignette for readability -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-lowest/80 via-transparent to-surface-container-lowest/90 pointer-events-none"></div>
</div>
<!-- Header -->
<header class="relative z-30 w-full bg-surface/75 backdrop-blur-md pt-safe">
<div class="h-16 px-margin-mobile flex items-center justify-between gap-gap-sm">
<div class="flex items-center gap-gap-sm">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high/80 text-on-surface hover:bg-surface-container-highest transition-colors" onclick="history.back()" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold tracking-tight text-on-surface truncate">Active Wayfinding Session</h1>
</div>
<div class="flex items-center gap-gap-xs">
<button aria-label="Voice Guidance" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high/80 text-on-surface hover:bg-surface-container-highest transition-colors" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[24px]">volume_up</span>
</button>
</div>
</div>
</header>
<!-- AR View Overlay Content -->
<main class="relative z-20 flex-1 flex flex-col justify-between px-margin-mobile pb-safe">
<!-- TOP COMPACT OVERLAY: Found Status & Spoken Text -->
<div class="pt-4 flex flex-col gap-2">
<div class="bg-surface-container-high/90 backdrop-blur-md p-4 rounded-DEFAULT shadow-2xl border border-white/5 flex flex-col gap-2.5">
<!-- Top Status Pill: FOUND & Direction -->
<div class="flex items-center justify-between gap-2">
<div class="inline-flex items-center gap-1.5 bg-primary-container text-on-primary-container px-2.5 py-1 rounded-full font-label-sm text-label-sm uppercase tracking-wider font-bold">
<span aria-hidden="true" class="w-2 h-2 rounded-full bg-on-primary-container"></span>
<span>FOUND</span>
</div>
<div class="font-headline-md text-headline-sm font-extrabold tracking-tight text-on-surface flex items-center gap-1.5 text-right">
<span>TO YOUR RIGHT</span>
<span aria-hidden="true" class="text-primary-container font-black">→</span>
</div>
</div>
<!-- Spoken Audio Text -->
<div class="flex items-center gap-2 pt-1 border-t border-white/10 text-on-surface">
<span aria-hidden="true" class="material-symbols-outlined text-[20px] text-primary-container shrink-0">record_voice_over</span>
<p class="font-body-md text-body-md font-medium">“Your backpack is to your right.”</p>
</div>
</div>
</div>
<!-- ONE Highlighted Object (Subtle warm-yellow bounding box on backpack) -->
<div class="absolute right-[10%] bottom-[24%] w-[38%] h-[38%] pointer-events-none z-10">
<div class="w-full h-full rounded-DEFAULT border-2 border-primary-container bg-primary-container/10 shadow-[0_0_12px_rgba(251,191,36,0.35)]">
<div class="absolute -top-3.5 left-2 bg-primary-container text-on-primary-container text-label-sm font-bold px-2 py-0.5 rounded-full shadow-sm">
        BACKPACK
      </div>
</div>
</div>
<!-- BOTTOM ACTION DOCK: Continue Guidance & Cancel -->
<div class="pb-6 flex flex-col gap-3">
<!-- Wide Primary Mobile Button -->
<button aria-label="Continue guidance" class="w-full h-14 bg-primary-container text-on-primary-container hover:bg-primary-fixed-dim active:scale-[0.99] rounded-full flex items-center justify-center gap-2 font-headline-sm text-label-lg font-bold shadow-xl transition-all" id="btn-continue-guidance" type="button">
<span>CONTINUE GUIDANCE</span>
<span aria-hidden="true" class="material-symbols-outlined text-[24px] font-bold">arrow_forward</span>
</button>
<!-- Secondary Cancel Button -->
<button aria-label="Cancel guidance" class="w-full h-12 bg-surface-container-high/90 backdrop-blur-md text-on-surface hover:bg-surface-container-highest active:scale-[0.99] rounded-full flex items-center justify-center font-label-md text-label-md font-semibold transition-colors" onclick="history.back()" type="button">

</div>
</main>
