<script>
  (function() {
    const micBtn = document.getElementById('mic-trigger');
    const micStatus = document.getElementById('mic-status');
    const pulseRing = document.getElementById('ambient-pulse');
    let isListening = false;

    if (micBtn && micStatus) {
      micBtn.addEventListener('click', () => {
        isListening = !isListening;
        micBtn.setAttribute('aria-pressed', isListening ? 'true' : 'false');
        if (isListening) {
          micStatus.textContent = 'Listening...';
          micStatus.classList.add('text-primary-container');
          pulseRing.classList.add('animate-ping', 'bg-primary-container/30');
        } else {
          micStatus.textContent = 'Tap to speak';
          micStatus.classList.remove('text-primary-container');
          pulseRing.classList.remove('animate-ping', 'bg-primary-container/30');
        }
      });
    }
  })();
